name: Flash Arb Scanner (dry run)

# Free 24/7 hosting: GitHub Actions cron, same pattern as paper-scan.yml.
# Scans Base mainnet for flash-loan arb opportunities and writes one row per
# scan straight into Postgres; the dashboard POST is a best-effort extra that
# nothing depends on. Always dry run — no tx is ever sent from CI. Live
# execution stays a manual, local decision.

# Cadence, measured rather than declared: this file used to ask for */10 and
# GitHub delivered about 8 runs a day, not 144 — scheduled workflows are
# throttled and the surplus is dropped silently. Asking every 10 minutes only
# made the schedule a lie, so the cron now states a rate near what is actually
# granted, and each granted run scans continuously for BURST minutes instead of
# once. That turns ~8 scans a day into several hundred without pretending the
# trigger fires more often than it does.

on:
  schedule:
    - cron: "0 */2 * * *"    # roughly what GitHub actually grants a free repo
  workflow_dispatch:

permissions:
  contents: read

# One burst at a time. A queued duplicate would scan the same pairs twice and
# file duplicate rows; letting the running burst finish is the useful choice.
concurrency:
  group: flash-arb-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install "web3>=7.0" httpx structlog "psycopg[binary]"

      - name: Scan continuously for 25 minutes (dry run)
        run: python -m api.flash_server
        env:
          FLASH_ARB_BURST_SEC: "1500"     # 25 min, inside the 30 min job timeout
          FLASH_SCAN_INTERVAL: "30"       # ~50 scans per run, each its own row
          FLASH_ARB_DRY_RUN: "1"
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
          BOT_INTERNAL_SECRET: ${{ secrets.BOT_INTERNAL_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DASHBOARD_URL: https://arbiterbot.vercel.app

      # The dashboard POST is the only record this job used to leave, and it is
      # silently dropped whenever the shared secret is missing on the Vercel
      # side — which is how a month of scans vanished. The run summary is
      # written from the state file the scan just produced, so each run carries
      # its own evidence in the Actions UI regardless of the dashboard.
      - name: Record scan result in the run summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("storage/flash_arb_state.json")
          if not p.exists():
              print("## Flash arb scan\n\nNo state file — the scan did not complete.")
              raise SystemExit(0)
          s = json.loads(p.read_text())
          print("## Flash arb scan\n")
          print(f"- **Scanned at** {s.get('last_scan','?')}")
          print(f"- **Pairs** {s.get('pairs_scanned',0)}  ·  "
                f"**Opportunities** {len(s.get('opportunities',[]))}  ·  "
                f"**Errors** {s.get('errors',0)}")
          print(f"- **Best edge** {s.get('best_edge_pct',0):.4f}%")
          atlas = s.get("atlas")
          if atlas:
              regime = "risk-on" if atlas.get("risk_on") else "risk-off"
              names = ", ".join(
                  f"{x['symbol']}={x['action']}({x['bull_prob']:.0f})"
                  for x in atlas.get("signals", [])
              )
              print(f"- **ATLAS-QUANT** {regime} — {names}")
          for o in s.get("opportunities", []):
              print(f"\n  - {o}")
          PY
