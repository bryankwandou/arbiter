# Dry-run edge watch: every strategy class we can observe with public data runs
# in parallel, one runner each, at $5 / $10 / $100 / $1k / $10k:
#   rounds    dex, tri, lst, peg, cex, stock, stat, wide (4 shards, ~100 tokens)
#   watchers  fast (WebSocket cex-dex), launch, liq, carry
# Positive cycles are also simulated on mainnet (sigVerify off). No keys, no
# orders, no signed transactions.
#
# Runs chain: the report job dispatches the next run the moment this one ends,
# so coverage does not depend on GitHub's cron (which drops scheduled runs).
# The hourly cron only restarts the chain if it ever breaks.
# Stop everything: gh workflow disable edge-watch.yml -R bryankwandou/arbiter
name: Edge watch (dry run)

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes per strategy job
        default: "320"
      chain:
        description: Dispatch the next run when this one ends
        default: "true"

concurrency:
  group: edge-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    if: github.repository == 'bryankwandou/arbiter'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        strategy: [dex, tri, lst, peg, cex, stock, stat, wide-0, wide-1, wide-2, wide-3, fast, launch, liq, carry]
    defaults:
      run:
        working-directory: solana-devnet/bot
    env:
      JOB: ${{ matrix.strategy }}
      NSHARD: "4"
      LOG: ./edge-${{ matrix.strategy }}.jsonl
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Watch
        run: |
          export STRATEGY="${JOB%%-*}"
          case "$JOB" in *-*) export SHARD="${JOB##*-}";; esac
          timeout $(( ${{ inputs.minutes || '320' }} * 60 )) node edge-watch.js || test $? -eq 124
      - name: Summary
        if: always()
        run: node edge-watch.js --summary | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edge-${{ matrix.strategy }}-${{ github.run_id }}
          path: solana-devnet/bot/edge-${{ matrix.strategy }}.jsonl
          retention-days: 30

  report:
    needs: watch
    if: always() && github.repository == 'bryankwandou/arbiter'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: edge-*-${{ github.run_id }}
          merge-multiple: true
          path: data
      - name: Combined summary
        run: node solana-devnet/bot/edge-watch.js --summary data/*.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Chain next run
        if: inputs.chain != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run edge-watch.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
