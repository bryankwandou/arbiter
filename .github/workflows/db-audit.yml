name: DB Audit (flash arb scans)

# Answers one question the CI logs cannot: is the database the scanner writes to
# the same database the dashboard reads from? The scanner logs "Scan recorded in
# database" on every run, yet /api/flash-arb still serves a July row — so this
# job prints what the CI-side DATABASE_URL actually contains.
# Read-only. Never writes, never executes a trade.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"   # once a day, so drift is caught without being asked

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install driver
        run: pip install "psycopg[binary]"

      - name: Report what the scanner's database holds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, psycopg

          url = os.environ.get("DATABASE_URL", "")
          print("## flash_arb_scans — CI-side database\n")
          if not url:
              print("`DATABASE_URL` is not set for this job — nothing to audit.")
              raise SystemExit(0)

          # Identify the database without ever printing the password.
          host = url.split("@")[-1].split("/")[0] if "@" in url else "?"
          dbname = url.split("/")[-1].split("?")[0]
          print(f"- **Host** `{host}`  ·  **Database** `{dbname}`\n")

          with psycopg.connect(url, connect_timeout=20) as conn, conn.cursor() as cur:
              cur.execute("SELECT to_regclass('public.flash_arb_scans')")
              if cur.fetchone()[0] is None:
                  print("Table `flash_arb_scans` does not exist in this database.")
                  raise SystemExit(0)

              cur.execute("""
                  SELECT COUNT(*), MIN(scanned_at), MAX(scanned_at),
                         COUNT(*) FILTER (WHERE scanned_at > NOW() - INTERVAL '24 hours')
                  FROM flash_arb_scans
              """)
              total, first, last, day = cur.fetchone()
              print(f"- **Rows** {total}  ·  **Last 24h** {day}")
              print(f"- **First** {first}  ·  **Latest** {last}\n")

              cur.execute("""
                  SELECT scanned_at, pairs_scanned, opps_found,
                         best_edge_pct, executions, dry_run, errors
                  FROM flash_arb_scans ORDER BY scanned_at DESC LIMIT 10
              """)
              print("| scanned_at | pairs | opps | best edge % | exec | dry run | err |")
              print("|---|---|---|---|---|---|---|")
              for r in cur.fetchall():
                  print("| " + " | ".join(str(x) for x in r) + " |")
          PY
